<!DOCTYPE html>
<html lang="pt-BR">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Frases</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Gerador de Frases</h1>

        <p id="frase">
            Clique no botão para gerar uma frase.
        </p>

        <button id="botao">
            Nova frase
        </button>

        <section class="historico">
            <h2>Frases sorteadas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Frase</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody id="historico-frases"></tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
